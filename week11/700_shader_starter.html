<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fragment Shader Starter</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    canvas {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
  <script>
    // Scene / Camera / Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(
      60,
      innerWidth / innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 2.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // ค่าที่ส่งจาก JavaScript เข้า shader
    const uniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
    uTexture: { value: new THREE.TextureLoader().load('https://preview.redd.it/so-ive-just-started-reading-one-piece-very-late-considering-v0-sbk4vawfo1ob1.jpg?auto=webp&s=7cfbacf71e97e344983188c8f9c8555cf4da7c16') }
  };

  const vertexShader = `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;//ข้อสอบ พองรับค่าปกติของ vertex เพื่อส่งไปยัง fragment
    varying vec3 vPosW;

    void main() {
      vUv = uv;
      vNormal = normal;
      vPosW = position;

      vec3 pos = position;

      // เริ่มเขียน vertex shader ที่นี่
      pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;

  const fragmentShader =`
    precision mediump float;

    uniform float uTime;
    uniform sampler2D uTexture;
    uniform vec3 uLightDir;
    varying vec3 vNormal;//ข้อมูล normal ที่ส่งมาจาก vertex shader
    varying vec2 vUv;
    varying vec3 vPosW;

    void main() {
      // เริ่มเขียน fragment shader ที่นี่
      //vec3 color = vec3(vUv, 0.5);
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uLightDir);

      //Lambert diffuse 
      float diffuse = max(dot(N, L), 0.0);
      float level = 3.0; //จำนวนขั้นบันไดของแสงเงา
      diffuse = floor(diffuse * level) / level; //ทำให้เกิด effect ของแสงเงาเป็นขั้นบันได floorปัดลง

      //Ambient 
      float ambient = 0.3;

      //Phong specular
      vec3 R = reflect(-L, N);//สะท้อนแสงจากทิศทางของแสง
      vec3 V = normalize(cameraPosition - vPosW);//ทิศทางจาก pixel ไปยังกล้อง
      float specular = pow (max(dot(R, V), 0.0), 16.0) * 0.9;//ทำให้เงาลดลงเมื่อมุมระหว่าง R และ V มีค่ามากกว่า 90 องศา เเละ32.0(ยกกำลัง) ทำให้จุดเงาเล็กลง
      //specular = floor(specular * 4.0) / 4.0; //ทำให้เกิด effect ของแสงเงาเป็นขั้นบันได floorปัดลง
      //specular = step(0.5, specular) ;
      specular = smoothstep(0.4, 0.6, specular); //ทำให้เกิด effect ของแสงเงาเป็นขั้นบันได smoothstep ทำให้เกิดการเปลี่ยนแปลงของค่าอย่างนุ่มนวล

      vec3 baseColor = vec3(1.0, 0.5, 0.5);
      //vec3 baseColor = texture2D(uTexture, vUv).xyz;//เพื่อดึงค่าพิกเซลจาก texture มาใช้เป็นสีของ pixel นั้น ๆ
      vec3 color = baseColor * (diffuse + ambient) + vec3(specular * 0.9);//คูณกับ diffuse เพื่อให้เกิดแสงเงาเเละบวกกับ ambient เพื่อให้เกิดแสงรอบ ๆ และบวกกับ specular เพื่อให้เกิดแสงสะท้อน
      gl_FragColor = vec4(color, 1.0);
    }
  `;

    // ใช้ segment หลายช่อง เพื่อให้ vertex shader ดัดรูปทรงได้ละเอียด

    //const geometry = new THREE.PlaneBufferGeometry(1.5, 1.5, 32, 32);
    const geometry = new THREE.SphereBufferGeometry(1.0, 32, 32);
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate(time) {
      uniforms.uTime.value = time * 0.001;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>

</html>
